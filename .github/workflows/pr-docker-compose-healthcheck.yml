name: Deployment and Docker Compose Healthcheck
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'install.sh'
      - 'start.sh'
      - 'scripts/deploy-*'
      - 'scripts/tests/**'
      - 'docker-compose.yml'
      - 'docker/**'
      - 'collector/**'
      - '.env.example'
      - '.dockerignore'
      - '.github/workflows/pr-docker-compose-healthcheck.yml'
  push:
    branches: [main]
    paths:
      - 'install.sh'
      - 'start.sh'
      - 'scripts/deploy-*'
      - 'docker-compose.yml'
      - 'collector/**'
      - '.github/workflows/pr-docker-compose-healthcheck.yml'
permissions:
  contents: read
jobs:
  healthcheck-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax and mocked install/update failures
        run: |
          bash -n install.sh start.sh scripts/deploy-common.sh
          python3 -m unittest discover -s scripts/tests -v
      - name: Fresh source deployment (no Discord or SMTP credentials)
        run: ./start.sh start --build
      - name: Verify IPC and observation defaults; repeat without replacing keys
        run: |
          sha256sum .env > /tmp/env.sha256
          ./start.sh status
          docker compose -p nofx -f docker-compose.yml exec -T discord-collector python healthcheck.py --describe
          python3 - <<'PY'
          import sqlite3
          db = sqlite3.connect('data/data.db')
          assert db.execute("SELECT count(*) FROM discord_configs WHERE run_mode = 'live'").fetchone()[0] == 0
          assert db.execute('SELECT count(*) FROM email_configs').fetchone()[0] == 0
          PY
          ./start.sh start --build
          sha256sum --check /tmp/env.sha256
          test "$(stat -c %a .env)" = 600
          test "$(stat -c %a data)" = 700
      - name: Failure diagnostics (no environment dump)
        if: failure()
        run: |
          docker compose -p nofx -f docker-compose.yml ps -a
          docker compose -p nofx -f docker-compose.yml logs --tail 150
      - name: Cleanup isolated CI resources
        if: always()
        run: docker compose -p nofx -f docker-compose.yml down -v
