services:
  # Backend service (API and core logic)
  nofx:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.backend
    container_name: nofx-trading
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    restart: unless-stopped
    stop_grace_period: 30s  # Allow the app 30 seconds for graceful shutdown
    ports:
      - "${NOFX_BACKEND_PORT:-8080}:8080"
      # pprof profiling is bound to host loopback only; uncomment for local debug.
      # - "127.0.0.1:6060:6060"
    volumes:
      # NOTE: .env is bind-mounted so the beginner-onboarding flow
      # (persistBeginnerWalletEnv) can write CLAW402_WALLET_* back to the host
      # file. Without this mount the wallet is regenerated on every container
      # restart. For threat models where the .env file should not be reachable
      # via container RCE, deploy via env vars only and remove this mount.
      - ./.env:/app/.env
      - ./data:/app/data
      - discord-runtime:/run/nofx-discord
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - AI_MAX_TOKENS=8000
      - DISCORD_SOCKET_PATH=/run/nofx-discord/collector.sock
    networks:
      - nofx-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  discord-collector:
    build:
      context: ./collector
      dockerfile: Dockerfile
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - discord-runtime:/run/nofx-discord
      - discord-buffer:/var/lib/discord-collector
    networks:
      - nofx-network
    depends_on:
      - nofx
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    mem_limit: 512m
    pids_limit: 128

  # Frontend service (static serving and proxy)
  nofx-frontend:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.frontend
    container_name: nofx-frontend
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    restart: unless-stopped
    ports:
      - "${NOFX_FRONTEND_PORT:-3000}:80"
    networks:
      - nofx-network
    depends_on:
      - nofx
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  nofx-network:
    driver: bridge

volumes:
  discord-runtime:
  discord-buffer:
